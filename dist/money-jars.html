<style>
[hidden] { display: none !important; }
:root {
  --bg: #fff8ee; --surface: #ffffff; --surface-2: #fdf1e1; --text: #2b2440; --muted: #6e6785;
  --border: #efe4d2; --shadow: 0 2px 0 rgba(43,36,64,.06), 0 8px 24px rgba(43,36,64,.06);
  --spend: #f47a2a; --spend-soft: #ffe6d4;
  --save: #e64a8f; --save-soft: #fde0ec;
  --invest: #1f9e66; --invest-soft: #d6f3e5;
  --gift: #7c4ce0; --gift-soft: #ebe1ff;
  --good: #1f9e66; --bad: #d23c3c; --warn-bg: #fff4d6; --warn-text: #7a5a00;
  --accent: #2b2440; --on-accent: #ffffff;
  --radius: 20px;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16131e; --surface: #221e2d; --surface-2: #2b2639; --text: #f4effa; --muted: #a9a1bd;
    --border: #3a3349; --shadow: none;
    --spend: #ff9a55; --spend-soft: #3d2a1d; --save: #ff6fa9; --save-soft: #3d1f2e;
    --invest: #3fcf8c; --invest-soft: #1a3529; --gift: #a688ff; --gift-soft: #2b2348;
    --good: #3fcf8c; --bad: #ff6b6b; --warn-bg: #3a3118; --warn-text: #ffd977;
    --accent: #f4effa; --on-accent: #16131e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16131e; --surface: #221e2d; --surface-2: #2b2639; --text: #f4effa; --muted: #a9a1bd;
  --border: #3a3349; --shadow: none;
  --spend: #ff9a55; --spend-soft: #3d2a1d; --save: #ff6fa9; --save-soft: #3d1f2e;
  --invest: #3fcf8c; --invest-soft: #1a3529; --gift: #a688ff; --gift-soft: #2b2348;
  --good: #3fcf8c; --bad: #ff6b6b; --warn-bg: #3a3118; --warn-text: #ffd977;
  --accent: #f4effa; --on-accent: #16131e; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
body { -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
#app { max-width: 980px; margin: 0 auto; padding: 12px 16px 96px; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.25rem; }
.brand svg { width: 32px; height: 32px; }
.top nav { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px; }
.top nav button { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.top nav button.on { background: var(--accent); color: var(--on-accent); }

/* kid tabs */
.kids { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
.kid-tab { display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 8px; border-radius: 999px; border: 2px solid var(--border); background: var(--surface); font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
.kid-tab .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 1.3rem; background: var(--surface-2); }
.kid-tab.on { border-color: var(--kid, var(--accent)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--kid, var(--accent)) 25%, transparent); }

/* hero */
.hero { display: flex; gap: 16px; align-items: center; background: var(--surface); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 14px; }
.hero .avatar { width: 72px; height: 72px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 2.4rem; background: color-mix(in srgb, var(--kid) 18%, var(--surface)); border: 3px solid var(--kid); }
.hero h1 { font-size: 1.1rem; color: var(--muted); font-weight: 700; }
.hero .big { font-size: clamp(2.2rem, 8vw, 3.2rem); font-weight: 900; letter-spacing: -.02em; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-weight: 600; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; background: var(--text); }
.dot.parent { background: repeating-linear-gradient(45deg, var(--muted) 0 3px, transparent 3px 6px); border: 1px solid var(--muted); }

/* actions */
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.act { border: 0; border-radius: 16px; padding: 14px 8px; font-weight: 800; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .95rem; }
.act .e { font-size: 1.6rem; }
.act.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* jars */
.jars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 14px; }
@media (min-width: 760px) { .jars { grid-template-columns: repeat(4, 1fr); } }
.jar { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.jar-top { background: var(--c-soft); padding: 12px 14px; display: flex; align-items: center; gap: 8px; }
.jar-top .e { font-size: 1.8rem; }
.jar-top .n { font-weight: 900; font-size: 1.15rem; color: var(--c); }
.jar-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.jar-amt { font-size: 1.7rem; font-weight: 900; }
.bar { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar .k { background: var(--c); }
.bar .p { background: repeating-linear-gradient(45deg, var(--c) 0 4px, color-mix(in srgb, var(--c) 45%, var(--surface)) 4px 8px); }
.jar-legend { font-size: .85rem; color: var(--muted); font-weight: 600; }
.jar-note { font-size: .85rem; color: var(--muted); }
.jar-spend { --c: var(--spend); --c-soft: var(--spend-soft); }
.jar-save { --c: var(--save); --c-soft: var(--save-soft); }
.jar-invest { --c: var(--invest); --c-soft: var(--invest-soft); }
.jar-gift { --c: var(--gift); --c-soft: var(--gift-soft); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--c-soft); color: var(--c); }
.goal { font-size: .85rem; font-weight: 600; }
.goal .bar { height: 8px; margin-top: 4px; }

/* cards */
.card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 1.1rem; margin-bottom: 10px; }
.two { display: grid; gap: 14px; }
@media (min-width: 760px) { .two { grid-template-columns: 1fr 1fr; } }
.two .card { margin-bottom: 0; }
.rules { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.rules li { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.rules .e { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--c-soft); font-size: 1.2rem; flex: none; }
.rules b { color: var(--c); }

/* activity */
.list { list-style: none; margin: 0; padding: 0; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); font-size: 1.2rem; flex: none; }
.item .mid { flex: 1; min-width: 0; }
.item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: .82rem; color: var(--muted); }
.item .amt { text-align: right; font-weight: 800; white-space: nowrap; }
.item .amt .s { font-weight: 600; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.empty { text-align: center; padding: 24px; color: var(--muted); }

/* buttons + forms */
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
.btn.block { width: 100%; padding: 14px; font-size: 1.05rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: .9rem; }
input, select, textarea { border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px; background: var(--surface); min-width: 0; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 3px solid color-mix(in srgb, var(--invest) 35%, transparent); border-color: var(--invest); }
input.money { font-size: 1.6rem; font-weight: 800; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 480px) { .grid4 { grid-template-columns: 1fr 1fr; } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 14px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 10px 6px; border-radius: 10px; font-weight: 800; cursor: pointer; }
.seg label:has(input:checked) { background: var(--surface); box-shadow: var(--shadow); outline: 2px solid var(--accent); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--invest); }
.jarpick label { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .85rem; }
.jarpick label .e { font-size: 1.4rem; }
.jarpick label .b { font-size: .75rem; color: var(--muted); font-weight: 600; }
.jarpick label:has(input:disabled) { opacity: .4; cursor: not-allowed; }
.msg { border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: .9rem; }
.msg.err { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--bad); }
.msg.warn { background: var(--warn-bg); color: var(--warn-text); }
.msg.ok { background: var(--invest-soft); color: var(--invest); }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 700; }
.check input { width: 22px; height: 22px; flex: none; margin: 0; }
table.t { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.t th, table.t td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
table.t th { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
table.t td.r, table.t th.r { text-align: right; }
table.t tfoot td { font-weight: 800; border-bottom: 0; }
.scroll-x { overflow-x: auto; }
.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--warn-bg); color: var(--warn-text); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; font-weight: 700; flex-wrap: wrap; }
.emoji-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.emoji-pick label { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 1.5rem; background: var(--surface-2); cursor: pointer; position: relative; }
.emoji-pick input { position: absolute; opacity: 0; }
.emoji-pick label:has(input:checked) { outline: 3px solid var(--accent); }
.swatch { width: 100%; height: 100%; border-radius: 10px; }
details.help summary { cursor: pointer; font-weight: 700; }
fieldset { border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin: 0; }
legend { font-weight: 800; padding: 0 6px; }
.section-title { font-size: 1.25rem; font-weight: 900; margin: 6px 0 12px; }

/* sheet */
dialog#sheet { border: 0; padding: 0; background: var(--surface); color: var(--text); border-radius: 24px; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog#sheet::backdrop { background: rgba(22,19,30,.5); }
@media (max-width: 600px) {
  dialog#sheet { margin: auto auto 0; width: 100vw; max-width: 100vw; border-radius: 24px 24px 0 0; max-height: 92dvh; }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 8px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.sheet-head h2 { font-size: 1.25rem; }
.sheet-close { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; }
.sheet-body { padding: 8px 18px 20px; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%); background: var(--accent); color: var(--on-accent); padding: 12px 18px; border-radius: 14px; font-weight: 800; transition: transform .25s ease; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
#toast:not(.show) { visibility: hidden; opacity: 0; }
#toast.show { transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<body>
<div id="app"></div>
<dialog id="sheet"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/*
 * Money Jars core logic. Pure functions, no DOM.
 * All money is stored as integer cents. Dates are 'YYYY-MM-DD' strings.
 * Works in the browser (window.Core) and in Node (require('./core.js')).
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Core = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const BUCKETS = ['spend', 'save', 'invest', 'gift'];
  const BUCKET_INFO = {
    spend: { label: 'Spend', emoji: '🛍️', blurb: 'Ready to use on things you want' },
    save: { label: 'Save', emoji: '🐷', blurb: 'For big goals later' },
    invest: { label: 'Invest', emoji: '🌱', blurb: 'Grows you and your ideas' },
    gift: { label: 'Gift', emoji: '🎁', blurb: 'For presents and good causes' },
  };
  const TYPE_INFO = {
    'gift-in': { label: 'Gift received', emoji: '🎉' },
    'earned-in': { label: 'Money earned', emoji: '💪' },
    spend: { label: 'Spent', emoji: '🛍️' },
    give: { label: 'Gave', emoji: '🎁' },
    'invest-use': { label: 'Invested in me', emoji: '🌱' },
    transfer: { label: 'Moved money', emoji: '🔁' },
    interest: { label: 'Save interest', emoji: '🏦' },
    bonus: { label: 'Birthday saver bonus', emoji: '🎂' },
    growth: { label: 'Invest value change', emoji: '📈' },
    adjust: { label: 'Correction', emoji: '✏️' },
  };
  const OUT_TYPE = { spend: 'spend', gift: 'give', invest: 'invest-use' };
  const AUTO_TYPES = ['interest', 'bonus'];

  function defaultSettings() {
    return {
      parentName: 'Mom & Dad',
      giftSplit: { spend: 25, save: 25, invest: 25, gift: 25 },
      match: { spend: 0, save: 25, invest: 100, gift: 50 },
      matchEarned: true,
      saveAPR: 4,
      saveMaxWithdrawPct: 30,
      saveWindow: 'quarter',
      saveWithdrawalsPerWindow: 1,
      saveMilestones: [100, 250, 500, 1000, 2500, 5000, 10000],
      birthdayBonusPct: 10,
      birthdayNoWithdrawBonusPct: 5,
      investPurposes: [
        'Education or tutoring',
        'Books',
        'Course or class',
        'Business idea',
        'Lemonade stand or small business',
        'Prototype, tools or supplies',
        'Other investment in myself',
      ],
      autoInterest: true,
      autoBirthday: true,
      pin: '',
    };
  }

  function defaultState() {
    return { app: 'money-jars', version: 1, kids: [], txns: [], settings: defaultSettings() };
  }

  // ---------- small helpers ----------
  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function dateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return dateStr(new Date()); }
  function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return { y, m, d }; }
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
  function endOfMonth(y, m) { return y + '-' + pad(m) + '-' + pad(daysInMonth(y, m)); }
  function safeDate(y, m, d) { return y + '-' + pad(m) + '-' + pad(Math.min(d, daysInMonth(y, m))); }
  function daysBetween(a, b) {
    const pa = parseDate(a), pb = parseDate(b);
    return Math.round((Date.UTC(pb.y, pb.m - 1, pb.d) - Date.UTC(pa.y, pa.m - 1, pa.d)) / 86400000);
  }

  function toCents(input) {
    if (typeof input === 'number') return Math.round(input * 100);
    const s = String(input || '').replace(/[$,\s]/g, '');
    if (!/^-?\d*(\.\d*)?$/.test(s) || s === '' || s === '.' || s === '-') return NaN;
    return Math.round(parseFloat(s) * 100);
  }
  function fmt(cents, opts) {
    const neg = cents < 0;
    const abs = Math.abs(Math.round(cents));
    const dollars = Math.floor(abs / 100).toLocaleString('en-US');
    const c = pad(abs % 100);
    const short = opts && opts.short && abs % 100 === 0;
    return (neg ? '-' : '') + '$' + dollars + (short ? '' : '.' + c);
  }

  // Split `total` cents by percentage weights so the parts add up exactly.
  function allocate(total, weights) {
    const out = {};
    let used = 0;
    const rema = [];
    BUCKETS.forEach((b) => {
      const exact = (total * (Number(weights[b]) || 0)) / 100;
      out[b] = Math.floor(exact);
      used += out[b];
      rema.push([b, exact - out[b]]);
    });
    rema.sort((a, b) => b[1] - a[1]);
    let left = total - used;
    for (let i = 0; left > 0 && i < rema.length; i++, left--) out[rema[i][0]] += 1;
    return out;
  }

  function splitTotal(split) {
    return BUCKETS.reduce((s, b) => s + (Number(split[b]) || 0), 0);
  }

  // Split an amount between kid and parent money in proportion to what is in the bucket.
  function proRata(amount, bal) {
    const total = bal.kid + bal.parent;
    if (total <= 0) return { kid: amount, parent: 0 };
    let parent = Math.round((amount * bal.parent) / total);
    if (amount > 0 && parent > bal.parent) parent = bal.parent;
    return { kid: amount - parent, parent };
  }

  function sortedTxns(state) {
    return state.txns.slice().sort((a, b) =>
      a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0));
  }

  // ---------- balances ----------
  function emptyBalances() {
    const out = {};
    BUCKETS.forEach((b) => (out[b] = { kid: 0, parent: 0, total: 0 }));
    out.all = { kid: 0, parent: 0, total: 0 };
    return out;
  }

  function balances(state, kidId, asOf) {
    const out = emptyBalances();
    state.txns.forEach((t) => {
      if (t.kidId !== kidId) return;
      if (asOf && t.date > asOf) return;
      t.lines.forEach((l) => {
        out[l.bucket][l.owner] += l.amount;
        out[l.bucket].total += l.amount;
        out.all[l.owner] += l.amount;
        out.all.total += l.amount;
      });
    });
    return out;
  }

  // ---------- Save rules ----------
  function windowKey(date, win) {
    const { y, m } = parseDate(date);
    if (win === 'month') return y + '-' + pad(m);
    if (win === 'half') return y + '-H' + (m <= 6 ? 1 : 2);
    if (win === 'year') return String(y);
    return y + '-Q' + Math.ceil(m / 3);
  }
  function windowLabel(win) {
    return { month: 'this month', quarter: 'this quarter', half: 'this half-year', year: 'this year' }[win] || 'this quarter';
  }
  function nextWindowStart(date, win) {
    const { y, m } = parseDate(date);
    const size = { month: 1, quarter: 3, half: 6, year: 12 }[win] || 3;
    const startM = Math.floor((m - 1) / size) * size + 1;
    let nm = startM + size, ny = y;
    if (nm > 12) { nm -= 12; ny += 1; }
    return ny + '-' + pad(nm) + '-01';
  }

  function isSaveWithdrawal(t) {
    return t.type === 'transfer' && t.from === 'save';
  }

  function saveStatus(state, kidId, date, excludeTxnId) {
    const s = state.settings;
    date = date || todayStr();
    let running = 0, maxEver = 0;
    sortedTxns(state).forEach((t) => {
      if (t.kidId !== kidId || t.id === excludeTxnId) return;
      t.lines.forEach((l) => { if (l.bucket === 'save') running += l.amount; });
      if (running > maxEver) maxEver = running;
    });
    const bal = balances(state, kidId).save.total;
    const milestones = (s.saveMilestones || []).map((m) => Math.round(m * 100)).sort((a, b) => a - b);
    const reached = milestones.filter((m) => m <= maxEver);
    const lockedFloor = reached.length ? reached[reached.length - 1] : 0;
    const nextMilestone = milestones.find((m) => m > bal) || null;
    const key = windowKey(date, s.saveWindow);
    const used = state.txns.filter((t) => t.kidId === kidId && t.id !== excludeTxnId &&
      isSaveWithdrawal(t) && windowKey(t.date, s.saveWindow) === key).length;
    const limit = Number(s.saveWithdrawalsPerWindow) || 1;
    const byPct = Math.floor((bal * (Number(s.saveMaxWithdrawPct) || 0)) / 100);
    const byFloor = Math.max(0, bal - lockedFloor);
    const maxAllowed = used >= limit ? 0 : Math.max(0, Math.min(byPct, byFloor));
    return {
      balance: bal, maxEver, lockedFloor, reached, nextMilestone,
      windowUsed: used, windowLimit: limit, windowLabel: windowLabel(s.saveWindow),
      nextWindowStart: nextWindowStart(date, s.saveWindow), byPct, byFloor, maxAllowed,
    };
  }

  function checkSaveWithdrawal(state, kidId, amount, date, excludeTxnId) {
    const st = saveStatus(state, kidId, date, excludeTxnId);
    const s = state.settings;
    const warnings = [];
    if (st.windowUsed >= st.windowLimit) {
      warnings.push('Save already had ' + st.windowUsed + ' take-out ' + st.windowLabel +
        '. The next window opens ' + st.nextWindowStart + '.');
    }
    if (amount > st.byPct) {
      warnings.push('Only ' + s.saveMaxWithdrawPct + '% of Save (' + fmt(st.byPct) + ') can come out at once.');
    }
    if (st.balance - amount < st.lockedFloor) {
      warnings.push(fmt(st.lockedFloor) + ' is locked because that milestone was reached. Only ' +
        fmt(st.byFloor) + ' is above the lock.');
    }
    return { status: st, warnings };
  }

  // ---------- transaction builders ----------
  // Each returns { txn, errors: [], warnings: [] }. Errors block. Warnings need a parent override.
  function baseTxn(p, type) {
    return {
      id: newId(), kidId: p.kidId, date: p.date || todayStr(), type,
      note: (p.note || '').trim(), category: p.category || '', lines: [], createdAt: Date.now(),
    };
  }

  function buildMoneyIn(state, p) {
    const s = state.settings;
    const errors = [], warnings = [];
    const kind = p.kind === 'earned' ? 'earned' : 'gift';
    const amount = p.amount;
    if (!(amount > 0)) errors.push('Enter an amount greater than zero.');
    const split = kind === 'gift' ? s.giftSplit : p.split;
    if (!split || splitTotal(split) !== 100) errors.push('The split must add up to 100%.');
    const txn = baseTxn(p, kind + '-in');
    txn.split = Object.assign({}, split);
    if (errors.length) return { txn, errors, warnings };
    const parts = allocate(amount, split);
    const doMatch = kind === 'gift' || s.matchEarned;
    let matchTotal = 0;
    BUCKETS.forEach((b) => {
      if (parts[b] > 0) {
        txn.lines.push({ bucket: b, owner: 'kid', amount: parts[b] });
        const m = doMatch ? Math.round((parts[b] * (Number(s.match[b]) || 0)) / 100) : 0;
        if (m > 0) { txn.lines.push({ bucket: b, owner: 'parent', amount: m }); matchTotal += m; }
      }
    });
    txn.matchTotal = matchTotal;
    if (kind === 'earned' && parts.spend === amount) {
      warnings.push('All of it is going to Spend, so there is no bonus. Putting some in Save, Invest or Gift earns a match.');
    }
    return { txn, errors, warnings, parts };
  }

  function buildOut(state, p) {
    const s = state.settings;
    const errors = [], warnings = [];
    const bucket = p.bucket;
    const txn = baseTxn(p, OUT_TYPE[bucket] || 'spend');
    if (!OUT_TYPE[bucket]) errors.push('Money can only be spent from Spend, Gift or Invest. Move Save money to Spend first.');
    if (!(p.amount > 0)) errors.push('Enter an amount greater than zero.');
    if (!txn.note) errors.push('Add a note about what it was for.');
    if (errors.length) return { txn, errors, warnings };
    const bal = balances(state, p.kidId)[bucket];
    if (p.amount > bal.total) errors.push('Only ' + fmt(bal.total) + ' is in ' + BUCKET_INFO[bucket].label + '.');
    if (bucket === 'invest') {
      if (!txn.category) errors.push('Pick what kind of investment this is.');
      else if ((s.investPurposes || []).indexOf(txn.category) === -1) {
        warnings.push('"' + txn.category + '" is not on the approved Invest list.');
      }
    }
    if (errors.length) return { txn, errors, warnings };
    const pr = proRata(p.amount, bal);
    if (pr.kid) txn.lines.push({ bucket, owner: 'kid', amount: -pr.kid });
    if (pr.parent) txn.lines.push({ bucket, owner: 'parent', amount: -pr.parent });
    return { txn, errors, warnings };
  }

  function buildTransfer(state, p) {
    const errors = [], warnings = [];
    const txn = baseTxn(p, 'transfer');
    txn.from = p.from; txn.to = p.to;
    if (BUCKETS.indexOf(p.from) === -1 || BUCKETS.indexOf(p.to) === -1) errors.push('Pick both jars.');
    if (p.from === p.to) errors.push('Pick two different jars.');
    if (!(p.amount > 0)) errors.push('Enter an amount greater than zero.');
    if (errors.length) return { txn, errors, warnings };
    const bal = balances(state, p.kidId)[p.from];
    if (p.amount > bal.total) errors.push('Only ' + fmt(bal.total) + ' is in ' + BUCKET_INFO[p.from].label + '.');
    if (errors.length) return { txn, errors, warnings };
    if (p.from === 'save') warnings.push.apply(warnings, checkSaveWithdrawal(state, p.kidId, p.amount, txn.date).warnings);
    if (p.from === 'invest') warnings.push('Invest money is only for investing in yourself. Use "Spend" with an Invest reason instead.');
    if (p.from === 'gift') warnings.push('Gift money is meant for other people.');
    const pr = proRata(p.amount, bal);
    if (pr.kid) {
      txn.lines.push({ bucket: p.from, owner: 'kid', amount: -pr.kid });
      txn.lines.push({ bucket: p.to, owner: 'kid', amount: pr.kid });
    }
    if (pr.parent) {
      txn.lines.push({ bucket: p.from, owner: 'parent', amount: -pr.parent });
      txn.lines.push({ bucket: p.to, owner: 'parent', amount: pr.parent });
    }
    return { txn, errors, warnings };
  }

  function buildGrowth(state, p) {
    const errors = [], warnings = [];
    const txn = baseTxn(p, 'growth');
    if (!(p.newValue >= 0)) errors.push('Enter the current value of the investments.');
    if (errors.length) return { txn, errors, warnings };
    const bal = balances(state, p.kidId).invest;
    const delta = p.newValue - bal.total;
    if (delta === 0) errors.push('The value did not change.');
    if (errors.length) return { txn, errors, warnings };
    const pr = proRata(delta, bal);
    if (pr.kid) txn.lines.push({ bucket: 'invest', owner: 'kid', amount: pr.kid });
    if (pr.parent) txn.lines.push({ bucket: 'invest', owner: 'parent', amount: pr.parent });
    txn.note = txn.note || ('Invest value updated to ' + fmt(p.newValue));
    return { txn, errors, warnings };
  }

  function buildAdjust(state, p) {
    const errors = [], warnings = [];
    const txn = baseTxn(p, 'adjust');
    if (BUCKETS.indexOf(p.bucket) === -1) errors.push('Pick a jar.');
    if (p.owner !== 'kid' && p.owner !== 'parent') errors.push('Pick whose money it is.');
    if (!p.amount || isNaN(p.amount)) errors.push('Enter a non-zero amount. Use a minus sign to take money away.');
    if (!txn.note) errors.push('Add a note explaining the correction.');
    if (errors.length) return { txn, errors, warnings };
    const bal = balances(state, p.kidId)[p.bucket][p.owner];
    if (bal + p.amount < 0) warnings.push('This would make the balance negative.');
    txn.lines.push({ bucket: p.bucket, owner: p.owner, amount: p.amount });
    return { txn, errors, warnings };
  }

  // ---------- automatic entries: Save interest and birthday bonus ----------
  function kidStart(state, kid) {
    let start = kid.startDate || todayStr();
    state.txns.forEach((t) => { if (t.kidId === kid.id && !t.auto && t.date < start) start = t.date; });
    return start;
  }

  function birthdayOn(kid, year) {
    if (!kid.birthday) return null;
    const b = parseDate(kid.birthday);
    return safeDate(year, b.m, b.d);
  }

  function bonusFor(state, kidId, periodStart, periodEnd) {
    // periodStart exclusive, periodEnd inclusive
    const s = state.settings;
    let savedIn = 0, withdrawn = 0;
    state.txns.forEach((t) => {
      if (t.kidId !== kidId || t.date <= periodStart || t.date > periodEnd || t.auto) return;
      t.lines.forEach((l) => {
        if (l.bucket !== 'save') return;
        if (l.amount > 0 && l.owner === 'kid' && t.type !== 'growth') savedIn += l.amount;
        if (l.amount < 0 && t.type === 'transfer') withdrawn += -l.amount;
      });
    });
    const net = savedIn - withdrawn;
    let bonus = 0;
    if (net > 0) {
      bonus = Math.round((net * (Number(s.birthdayBonusPct) || 0)) / 100);
      if (withdrawn === 0) bonus += Math.round((net * (Number(s.birthdayNoWithdrawBonusPct) || 0)) / 100);
    }
    return { savedIn, withdrawn, net, bonus };
  }

  function birthdayPreview(state, kidId, today) {
    const kid = state.kids.find((k) => k.id === kidId);
    if (!kid || !kid.birthday) return null;
    today = today || todayStr();
    const y = parseDate(today).y;
    let next = birthdayOn(kid, y);
    if (next <= today) next = birthdayOn(kid, y + 1);
    const prevYear = parseDate(next).y - 1;
    const last = birthdayOn(kid, prevYear);
    const r = bonusFor(state, kidId, last, today);
    r.nextBirthday = next;
    r.daysUntil = daysBetween(today, next);
    r.turning = parseDate(next).y - parseDate(kid.birthday).y;
    return r;
  }

  // Adds any missing monthly interest and birthday bonus entries. Returns the new entries.
  function runAutoEntries(state, today) {
    today = today || todayStr();
    const s = state.settings;
    const added = [];
    state.kids.forEach((kid) => {
      const start = kidStart(state, kid);
      const has = (type, period) => state.txns.some((t) => t.kidId === kid.id && t.type === type && t.period === period);
      // Monthly interest on Save, paid by the parent, for each finished month.
      if (s.autoInterest && Number(s.saveAPR) > 0) {
        let { y, m } = parseDate(start);
        const now = parseDate(today);
        while (y < now.y || (y === now.y && m < now.m)) {
          const period = y + '-' + pad(m);
          if (!has('interest', period)) {
            const end = endOfMonth(y, m);
            const bal = balances(state, kid.id, end).save.total;
            const amt = Math.round((bal * Number(s.saveAPR)) / 100 / 12);
            if (amt > 0) {
              const t = {
                id: newId(), kidId: kid.id, date: end, type: 'interest', period, auto: true,
                note: s.saveAPR + '% yearly interest on ' + fmt(bal) + ' in Save',
                lines: [{ bucket: 'save', owner: 'parent', amount: amt }], createdAt: Date.now(),
              };
              state.txns.push(t); added.push(t);
            }
          }
          m += 1; if (m > 12) { m = 1; y += 1; }
        }
      }
      // Birthday saver bonus for each birthday since the kid started.
      if (s.autoBirthday && kid.birthday) {
        for (let y = parseDate(start).y; y <= parseDate(today).y; y++) {
          const bday = birthdayOn(kid, y);
          if (bday <= start || bday > today) continue;
          const period = String(y);
          if (has('bonus', period)) continue;
          const r = bonusFor(state, kid.id, birthdayOn(kid, y - 1), bday);
          if (r.bonus > 0) {
            const t = {
              id: newId(), kidId: kid.id, date: bday, type: 'bonus', period, auto: true,
              note: 'Saved ' + fmt(r.savedIn) + ', took out ' + fmt(r.withdrawn) + ' this year' +
                (r.withdrawn === 0 ? ' (no take-outs, extra bonus!)' : ''),
              lines: [{ bucket: 'save', owner: 'parent', amount: r.bonus }], createdAt: Date.now(),
            };
            state.txns.push(t); added.push(t);
          }
        }
      }
    });
    return added;
  }

  function clearAutoEntries(state) {
    const before = state.txns.length;
    state.txns = state.txns.filter((t) => !t.auto);
    return before - state.txns.length;
  }

  // ---------- import / export ----------
  function normalizeState(obj) {
    if (!obj || typeof obj !== 'object' || obj.app !== 'money-jars' || !Array.isArray(obj.kids) || !Array.isArray(obj.txns)) {
      throw new Error('This file is not a Money Jars backup.');
    }
    const st = defaultState();
    st.kids = obj.kids;
    st.txns = obj.txns;
    st.settings = Object.assign(defaultSettings(), obj.settings || {});
    st.savedAt = obj.savedAt;
    return st;
  }

  function csvCell(v) {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function toCSV(state) {
    const kidName = {};
    state.kids.forEach((k) => (kidName[k.id] = k.name));
    const rows = [['Date', 'Kid', 'Type', 'Jar', 'Whose money', 'Amount', 'Note', 'Category', 'Entry ID']];
    sortedTxns(state).forEach((t) => {
      t.lines.forEach((l) => {
        rows.push([t.date, kidName[t.kidId] || '', (TYPE_INFO[t.type] || {}).label || t.type,
          BUCKET_INFO[l.bucket].label, l.owner === 'kid' ? 'Kid' : 'Parent', (l.amount / 100).toFixed(2),
          t.note, t.category, t.id]);
      });
    });
    return rows.map((r) => r.map(csvCell).join(',')).join('\n');
  }

  return {
    BUCKETS, BUCKET_INFO, TYPE_INFO, AUTO_TYPES,
    defaultState, defaultSettings, newId, todayStr, dateStr, daysBetween,
    toCents, fmt, allocate, splitTotal, proRata, balances, sortedTxns,
    windowKey, saveStatus, checkSaveWithdrawal,
    buildMoneyIn, buildOut, buildTransfer, buildGrowth, buildAdjust,
    runAutoEntries, clearAutoEntries, birthdayPreview, bonusFor,
    normalizeState, toCSV,
  };
});
</script>
<script>
/* Money Jars UI. Depends on core.js (window.Core). */
(function () {
  'use strict';
  const C = window.Core;
  const B = C.BUCKETS, BI = C.BUCKET_INFO, TI = C.TYPE_INFO;
  const KEY = 'moneyJars.v1', META_KEY = 'moneyJars.meta';
  const S = { state: null, kidId: null, view: 'home', unlockedUntil: 0, histKid: 'all' };
  let meta = { lastBackupAt: null, driveFileId: null };

  const KID_EMOJI = ['🦊', '🐼', '🦁', '🐯', '🐨', '🐸', '🦄', '🐙', '🦖', '🐬', '🚀', '⚽', '🌟', '🎨', '🎸', '🏀'];
  const KID_COLORS = ['#f47a2a', '#e64a8f', '#1f9e66', '#7c4ce0', '#2a7de1', '#d4a017', '#0fa3a3', '#c2410c'];

  // ---------- storage ----------
  function loadAll() {
    try {
      const raw = localStorage.getItem(KEY);
      S.state = raw ? C.normalizeState(JSON.parse(raw)) : C.defaultState();
    } catch (e) {
      console.error(e);
      S.state = C.defaultState();
    }
    try { meta = Object.assign(meta, JSON.parse(localStorage.getItem(META_KEY) || '{}')); } catch (e) { /* ignore */ }
    S.kidId = S.state.kids[0] ? S.state.kids[0].id : null;
  }
  function persist() {
    S.state.savedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(S.state)); } catch (e) { toast('Could not save on this device: ' + e.message); }
    Drive.maybeAuto();
  }
  function saveMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) { /* ignore */ } }

  // ---------- helpers ----------
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = C.fmt;
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const kid = () => S.state.kids.find((k) => k.id === S.kidId);
  const st = () => S.state;
  const pName = () => st().settings.parentName || 'Parent';
  function niceDate(d) {
    const [y, m, dd] = d.split('-').map(Number);
    return new Date(y, m - 1, dd).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function perDollar(pct) {
    pct = Number(pct) || 0;
    if (pct <= 0) return 'no bonus';
    if (pct >= 100) return '+' + fmt(pct, { short: true }) + ' for every $1';
    return '+' + pct + '¢ for every $1';
  }
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }
  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  // ---------- parent lock ----------
  function parentOK() {
    return !st().settings.pin || Date.now() < S.unlockedUntil;
  }
  function requireParent(fn) {
    if (parentOK()) return fn();
    openSheet('Grown-up check 🔐', `
      <form class="stack" id="pinForm">
        <p class="muted">Enter the parent PIN to make changes.</p>
        <input name="pin" type="password" inputmode="numeric" autocomplete="off" class="money" aria-label="PIN" autofocus>
        <div class="msgs"></div>
        <button class="btn primary block">Unlock</button>
      </form>`, (form) => {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (form.pin.value === st().settings.pin) {
          S.unlockedUntil = Date.now() + 15 * 60 * 1000;
          closeSheet();
          render();
          fn();
        } else {
          $('.msgs', form).innerHTML = '<div class="msg err">That PIN is not right.</div>';
          form.pin.value = '';
        }
      });
    });
  }

  // ---------- sheet ----------
  function openSheet(title, body, init) {
    const d = $('#sheet');
    d.innerHTML = `<div class="sheet-head"><h2>${title}</h2><button class="sheet-close" data-action="close-sheet" aria-label="Close">✕</button></div><div class="sheet-body">${body}</div>`;
    if (!d.open) d.showModal();
    const form = $('form', d);
    if (init) init(form || d);
  }
  function closeSheet() { const d = $('#sheet'); if (d.open) d.close(); }

  // ---------- render ----------
  function render() {
    const app = $('#app');
    let html = header();
    if (S.view === 'settings') html += settingsView();
    else if (S.view === 'history') html += historyView();
    else if (!st().kids.length) html += welcomeView();
    else html += backupBanner() + kidTabs() + dashboard();
    app.innerHTML = html;
  }

  const LOGO = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="14" y="8" width="36" height="8" rx="3" fill="#7c4ce0"/><path d="M16 18h32c3 0 5 2 5 5v27c0 4-3 7-7 7H18c-4 0-7-3-7-7V23c0-3 2-5 5-5z" fill="#d6f3e5" stroke="#1f9e66" stroke-width="3"/><circle cx="32" cy="40" r="10" fill="#f6c443" stroke="#d49a00" stroke-width="2.5"/><text x="32" y="45" text-anchor="middle" font-size="13" font-weight="900" fill="#8a5d00" font-family="Arial">$</text></svg>`;

  function header() {
    const tab = (v, label) => `<button data-action="view" data-view="${v}" class="${S.view === v ? 'on' : ''}">${label}</button>`;
    const lock = st().settings.pin ? `<button data-action="lock" title="${parentOK() ? 'Lock parent mode' : 'Locked'}">${parentOK() ? '🔓' : '🔒'}</button>` : '';
    return `<header class="top"><div class="brand">${LOGO}<span>Money Jars</span></div><nav>${tab('home', 'Jars')}${tab('history', 'History')}${tab('settings', 'Settings')}${lock}</nav></header>`;
  }

  function backupBanner() {
    if (!st().txns.length) return '';
    const last = meta.lastBackupAt ? new Date(meta.lastBackupAt) : null;
    const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
    if (last && days < 7) return '';
    return `<div class="banner"><span>☁️ ${last ? 'Last backup was ' + days + ' days ago.' : 'Not backed up yet.'}</span><button class="btn" data-action="backup-now">Back up now</button></div>`;
  }

  function welcomeView() {
    return `<section class="card" style="text-align:center;padding:32px 20px">
      <div style="font-size:3rem">🛍️ 🐷 🌱 🎁</div>
      <h1 style="margin:12px 0 8px">Welcome to Money Jars</h1>
      <p class="muted">Every gift gets split into four jars. Grown-ups add a bonus to Save, Invest and Gift.</p>
      <div class="btn-row" style="justify-content:center;margin-top:16px">
        <button class="btn primary" data-action="kid-edit">➕ Add a kid</button>
        <button class="btn" data-action="restore-file">Restore a backup</button>
      </div></section>`;
  }

  function kidTabs() {

  function txnSummary(t) {
    let kidSum = 0, parSum = 0;
    t.lines.forEach((l) => { if (l.owner === 'kid') kidSum += l.amount; else parSum += l.amount; });
    const info = TI[t.type] || { label: t.type, emoji: '•' };
    let main = '', sub = '', cls = '';
    if (t.type === 'transfer') {
      const amt = t.lines.filter((l) => l.amount > 0).reduce((s, l) => s + l.amount, 0);
      main = fmt(amt);
      sub = BI[t.from].label + ' → ' + BI[t.to].label;
    } else {
      const tot = kidSum + parSum;
      cls = tot >= 0 ? 'pos' : 'neg';
      main = (tot >= 0 ? '+' : '') + fmt(tot);
      if (t.type === 'gift-in' || t.type === 'earned-in') { main = '+' + fmt(kidSum); sub = parSum ? '+' + fmt(parSum) + ' bonus' : 'no bonus'; }
      else {
        const jars = Array.from(new Set(t.lines.map((l) => BI[l.bucket].label)));
        sub = jars.join(', ');
      }
    }
    return { info, main, sub, cls };
  }

  function txnList(txns, showKid) {
    if (!txns.length) return '<div class="empty">Nothing here yet. Tap <b>Money in</b> to start.</div>';
    const names = {};
    st().kids.forEach((k) => (names[k.id] = k));
    return `<ul class="list">${txns.map((t) => {
      const x = txnSummary(t);
      const kk = names[t.kidId];
      return `<li class="item" data-action="txn" data-id="${t.id}" tabindex="0">
        <span class="ic" aria-hidden="true">${x.info.emoji}</span>
        <span class="mid"><div class="t">${esc(t.note || x.info.label)}</div>
          <div class="s">${niceDate(t.date)} · ${x.info.label}${t.category ? ' · ' + esc(t.category) : ''}${showKid && kk ? ' · ' + esc(kk.emoji + ' ' + kk.name) : ''}</div></span>
        <span class="amt num"><div class="${x.cls}">${x.main}</div><div class="s">${x.sub}</div></span>
      </li>`;
    }).join('')}</ul>`;
  }

  function saveSettings(form) {
    const s = st().settings;
    const f = form.elements;
    const n = (name) => Number(f[name].value);
    const split = {}, match = {};
    B.forEach((b) => { split[b] = n('split_' + b); match[b] = n('match_' + b); });
    const errs = [];
    if (C.splitTotal(split) !== 100) errs.push('The gift split adds up to ' + C.splitTotal(split) + '%. It must be 100%.');
    if (B.some((b) => !(split[b] >= 0) || !(match[b] >= 0))) errs.push('Percentages cannot be negative.');
    const ms = f.saveMilestones.value.split(/[,\s]+/).filter(Boolean).map(Number);
    if (ms.some((x) => !(x > 0))) errs.push('Milestones must be positive numbers.');
    if (errs.length) { $('.msgs', form).innerHTML = errs.map((e) => `<div class="msg err">${esc(e)}</div>`).join(''); return; }
    Object.assign(s, {
      giftSplit: split, match, matchEarned: f.matchEarned.checked, parentName: f.parentName.value.trim() || 'Mom & Dad',
      saveAPR: n('saveAPR'), saveMaxWithdrawPct: n('saveMaxWithdrawPct'), saveWindow: f.saveWindow.value,
      saveWithdrawalsPerWindow: Math.max(1, Math.round(n('saveWithdrawalsPerWindow'))),
      saveMilestones: ms.sort((a, b) => a - b), autoInterest: f.autoInterest.checked,
      birthdayBonusPct: n('birthdayBonusPct'), birthdayNoWithdrawBonusPct: n('birthdayNoWithdrawBonusPct'),
      autoBirthday: f.autoBirthday.checked,
      investPurposes: f.investPurposes.value.split('\n').map((x) => x.trim()).filter(Boolean),
      pin: f.pin.value.trim(),
    });
    if (s.pin) S.unlockedUntil = Date.now() + 15 * 60 * 1000;
    persist();
    runAuto();
    render();
    toast('Settings saved ✓');
  }

      ? `<label class="check"><input type="checkbox" name="override"> Parent override: allow this anyway</label>` : '';

  // Entries dated before this month change past month-end balances, so redo automatic entries quietly.
  function refreshAuto(date) {
    if (date < C.todayStr().slice(0, 8) + '01') { C.clearAutoEntries(st()); C.runAutoEntries(st()); }
    else C.runAutoEntries(st());
  }
  function commit(txn, label) {
    const before = C.saveStatus(st(), txn.kidId).lockedFloor;
    st().txns.push(txn);
    refreshAuto(txn.date);
    persist();
    closeSheet();
    render();
    const after = C.saveStatus(st(), txn.kidId).lockedFloor;
    if (after > before) toast('🎉 Save milestone! ' + fmt(after, { short: true }) + ' is now locked in.');
    else toast(label + ' ✓');
  }

            const par = r.txn.lines.filter((l) => l.bucket === b && l.owner === 'parent').reduce((a, l) => a + l.amount, 0);
            if (!kidAmt && !par) return '';
            return `<tr class="jar-${b}"><td>${BI[b].emoji} ${BI[b].label}</td><td class="r num">${fmt(kidAmt)}</td><td class="r num pos">${par ? '+' + fmt(par) : '—'}</td><td class="r num"><b>${fmt(kidAmt + par)}</b></td></tr>`;
          }).join('');
          $('.preview', form).innerHTML = `<table class="t"><thead><tr><th>Jar</th><th class="r">Yours</th><th class="r">Bonus</th><th class="r">Total</th></tr></thead><tbody>${rows}</tbody>
            <tfoot><tr><td>All jars</td><td class="r num">${fmt(p.amount)}</td><td class="r num pos">+${fmt(r.txn.matchTotal || 0)}</td><td class="r num">${fmt(p.amount + (r.txn.matchTotal || 0))}</td></tr></tfoot></table>`;
          $('.msgs', form).innerHTML = r.warnings.map((w) => `<div class="msg warn">💡 ${esc(w)}</div>`).join('');
        } else {
          $('.preview', form).innerHTML = '';
          $('.msgs', form).innerHTML = p.kind === 'earned' && total !== 100 ? `<div class="msg err">The split adds up to ${total}%. It must be 100%.</div>` : '';
        }
      };
      form.addEventListener('input', update);
      form.addEventListener('click', (e) => {
        const pre = e.target.closest('[data-preset]');
        if (!pre) return;
        B.forEach((b) => (form['sp_' + b].value = pre.dataset.preset === 'spend' ? (b === 'spend' ? 100 : 0) : s.giftSplit[b]));
        update();
      });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const r = C.buildMoneyIn(st(), params());
        if (r.errors.length) { $('.msgs', form).innerHTML = msgsHtml(r); return; }
        commit(r.txn, 'Added ' + fmt(params().amount) + (r.txn.matchTotal ? ' + ' + fmt(r.txn.matchTotal) + ' bonus' : ''));
      });
      update();
    });
  }

  function jarPicker(name, b, allowed, checked) {
    return `<div class="seg jarpick" role="radiogroup">${B.map((bk) => `<label class="jar-${bk}"><input type="radio" name="${name}" value="${bk}" ${bk === checked ? 'checked' : ''} ${allowed.indexOf(bk) === -1 ? 'disabled' : ''}><span class="e">${BI[bk].emoji}</span>${BI[bk].label}<span class="b num">${fmt(b[bk].total)}</span></label>`).join('')}</div>`;
  }

  function moneyOutSheet() {
    const k = kid();
    const b = C.balances(st(), k.id);
    const purposes = st().settings.investPurposes || [];
    openSheet('🛒 Spend or give', `
      <form class="stack">
        <div class="f"><b class="small">From which jar?</b>${jarPicker('bucket', b, ['spend', 'gift', 'invest'], 'spend')}</div>
        <p class="muted small" style="margin:0">Save money has to be moved to Spend first.</p>
        <label class="f">How much?<input name="amount" class="money" inputmode="decimal" placeholder="$0.00" autocomplete="off" required></label>
        <label class="f" id="noteLabel">What did you buy?<input name="note" placeholder="Lego set" required></label>
        <label class="f" id="catBox" hidden>What kind of investment?<select name="category"><option value="">Pick one</option>${purposes.map((p) => `<option>${esc(p)}</option>`).join('')}</select></label>
        <label class="f">Date<input type="date" name="date" value="${C.todayStr()}"></label>
        <div class="msgs"></div><div class="ovr"></div>
        <button class="btn primary block">Record it</button>
      </form>`, (form) => {
      const params = () => ({ kidId: k.id, bucket: form.bucket.value, amount: C.toCents(form.amount.value), note: form.note.value, category: form.category.value, date: form.date.value });
      const update = (final) => {
        const p = params();
        $('#catBox', form).hidden = p.bucket !== 'invest';
        $('#noteLabel', form).firstChild.textContent = { spend: 'What did you buy?', gift: 'Who or what was it for?', invest: 'What did you invest in?' }[p.bucket];
        form.note.placeholder = { spend: 'Lego set', gift: 'Birthday present for Mia', invest: 'Art class' }[p.bucket];
        if (!final && !(p.amount > 0)) { $('.msgs', form).innerHTML = ''; $('.ovr', form).innerHTML = ''; return null; }
        const r = C.buildOut(st(), p);
        const shown = final ? r : Object.assign({}, r, { errors: r.errors.filter((e) => !/note|Pick what kind/.test(e)) });
        $('.msgs', form).innerHTML = msgsHtml(shown);
        const had = $('[name=override]', form) && $('[name=override]', form).checked;
        $('.ovr', form).innerHTML = overrideBox(shown);
        if (had && $('[name=override]', form)) $('[name=override]', form).checked = true;
        return r;
      };
      form.addEventListener('input', (e) => { if (e.target.name !== 'override') update(false); });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const r = update(true);
        if (r.errors.length) return;
        if (r.warnings.length && !(form.override && form.override.checked)) { toast('Tick "Parent override" to allow this'); return; }
        requireParent(() => commit(r.txn, TI[r.txn.type].label + ' ' + fmt(params().amount)));
      });
      update(false);
    });
  }

  function moveSheet() {
    const k = kid();
    const b = C.balances(st(), k.id);
    const ss = C.saveStatus(st(), k.id);
    openSheet('🔁 Move between jars', `
      <form class="stack">
        <div class="f"><b class="small">From</b>${jarPicker('from', b, B, 'spend')}</div>
        <div class="f"><b class="small">To</b>${jarPicker('to', b, B, 'save')}</div>
        <div class="hint"></div>
        <label class="f">How much?<input name="amount" class="money" inputmode="decimal" placeholder="$0.00" autocomplete="off" required></label>
        <label class="f">Why? (optional)<input name="note" placeholder="Saving up for a bike"></label>
        <label class="f">Date<input type="date" name="date" value="${C.todayStr()}"></label>
        <p class="muted small" style="margin:0">Moving money does not earn a new bonus.</p>
        <div class="msgs"></div><div class="ovr"></div>
        <button class="btn primary block">Move it</button>
      </form>`, (form) => {
      const params = () => ({ kidId: k.id, from: form.from.value, to: form.to.value, amount: C.toCents(form.amount.value), note: form.note.value, date: form.date.value });
      const update = (final) => {
        const p = params();
        $('.hint', form).innerHTML = p.from === 'save'
          ? `<div class="msg ok">🐷 Save can let out up to <b>${fmt(ss.maxAllowed)}</b> ${ss.windowLabel}.${ss.lockedFloor ? ' ' + fmt(ss.lockedFloor, { short: true }) + ' is locked.' : ''}</div>` : '';
        if (!final && !(p.amount > 0)) { $('.msgs', form).innerHTML = ''; $('.ovr', form).innerHTML = ''; return null; }
        const r = C.buildTransfer(st(), p);
        $('.msgs', form).innerHTML = msgsHtml(r);
        const had = $('[name=override]', form) && $('[name=override]', form).checked;
        $('.ovr', form).innerHTML = overrideBox(r);
        if (had && $('[name=override]', form)) $('[name=override]', form).checked = true;
        return r;
      };
      form.addEventListener('input', (e) => { if (e.target.name !== 'override') update(false); });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const r = update(true);
        if (r.errors.length) return;
        if (r.warnings.length && !(form.override && form.override.checked)) { toast('Tick "Parent override" to allow this'); return; }
        const p = params();
        if (!r.txn.note) r.txn.note = 'Moved ' + BI[p.from].label + ' to ' + BI[p.to].label;
        requireParent(() => commit(r.txn, 'Moved ' + fmt(p.amount)));
      });
      update(false);
    });
  }

  function moreSheet() {
    openSheet('More', `<div class="stack">
      <button class="btn block" data-action="growth">📈 Update Invest value</button>
      <button class="btn block" data-action="adjust">✏️ Make a correction</button>
      <button class="btn block" data-action="kid-edit" data-id="${S.kidId}">⚙️ Edit ${esc(kid().name)}</button>
    </div>`);
  }

  function growthSheet() {
    const k = kid();
    const b = C.balances(st(), k.id).invest;
    openSheet('📈 Update Invest value', `
      <form class="stack">
        <p class="muted" style="margin:0">If Invest money is in a real account, enter what it is worth today. Gains and losses are shared between ${esc(k.name)} and ${esc(pName())} by how much each put in.</p>
        <p style="margin:0">Invest jar now: <b>${fmt(b.total)}</b></p>

        <label class="f">Note (optional)<input name="note" placeholder="Brokerage statement"></label>

  function adjustSheet() {
    const k = kid();
    openSheet('✏️ Correction', `
      <form class="stack">
        <p class="muted" style="margin:0">Use this to fix a mistake or to enter starting balances. Use a minus sign to take money away.</p>
        <div class="grid2">
          <label class="f">Jar<select name="bucket">${B.map((b) => `<option value="${b}">${BI[b].emoji} ${BI[b].label}</option>`).join('')}</select></label>
          <label class="f">Whose money<select name="owner"><option value="kid">${esc(k.name)}'s</option><option value="parent">${esc(pName())} bonus</option></select></label>
        </div>
        <label class="f">Amount<input name="amount" class="money" inputmode="decimal" placeholder="$0.00" required></label>
        <label class="f">Reason<input name="note" placeholder="Starting balance" required></label>
        <label class="f">Date<input type="date" name="date" value="${C.todayStr()}"></label>
        <div class="msgs"></div><div class="ovr"></div>
        <button class="btn primary block">Save correction</button>
      </form>`, (form) => {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const r = C.buildAdjust(st(), { kidId: k.id, bucket: form.bucket.value, owner: form.owner.value, amount: C.toCents(form.amount.value), note: form.note.value, date: form.date.value });
        $('.msgs', form).innerHTML = msgsHtml(r);
        if (r.errors.length) return;
        if (r.warnings.length && !(form.override && form.override.checked)) { $('.ovr', form).innerHTML = overrideBox(r); return; }
        requireParent(() => commit(r.txn, 'Correction saved'));
      });
    });
  }

  function txnSheet(id) {
    const t = st().txns.find((x) => x.id === id);
    if (!t) return;
    const x = txnSummary(t);
    const k = st().kids.find((kk) => kk.id === t.kidId);
    openSheet(x.info.emoji + ' ' + x.info.label, `
      <div class="stack">
        <div><div style="font-size:1.6rem;font-weight:900" class="${x.cls}">${x.main}</div><div class="muted">${x.sub}</div></div>
        ${t.note ? `<p style="margin:0"><b>Note:</b> ${esc(t.note)}</p>` : ''}
        ${t.category ? `<p style="margin:0"><b>Invest use:</b> ${esc(t.category)}</p>` : ''}
        <p class="muted" style="margin:0">${niceDate(t.date)} · ${esc(k ? k.name : '')}</p>
        <table class="t"><thead><tr><th>Jar</th><th>Whose</th><th class="r">Amount</th></tr></thead><tbody>
          ${t.lines.map((l) => `<tr><td>${BI[l.bucket].emoji} ${BI[l.bucket].label}</td><td>${l.owner === 'kid' ? esc(k ? k.name : 'Kid') : esc(pName())}</td><td class="r num ${l.amount < 0 ? 'neg' : 'pos'}">${fmt(l.amount)}</td></tr>`).join('')}
        </tbody></table>
        ${t.auto ? '<p class="muted small" style="margin:0">Added automatically. Change the rules in Settings, then use Recalculate.</p>'
          : `<button class="btn danger" data-action="txn-delete" data-id="${t.id}">🗑️ Delete this entry</button>`}
      </div>`);
  }

  // ---------- auto entries ----------
  function runAuto() {
    const added = C.runAutoEntries(st());
    if (added.length) {
      persist();
      const ni = added.filter((t) => t.type === 'interest').length, nb = added.length - ni;
      toast('Added ' + [ni ? ni + ' interest payment' + (ni > 1 ? 's' : '') : '', nb ? nb + ' birthday bonus' + (nb > 1 ? 'es' : '') : ''].filter(Boolean).join(' and ') + ' 🎉');
    }
  }

  // ---------- backup ----------
  function backupJSON() { return JSON.stringify(Object.assign({}, st(), { savedAt: new Date().toISOString() }), null, 2); }
  function backupName() { return 'money-jars-backup-' + C.todayStr() + '.json'; }
  function markBackedUp() { meta.lastBackupAt = new Date().toISOString(); saveMeta(); }
  async function shareBackup() {
    const file = new File([backupJSON()], backupName(), { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Money Jars backup' }); markBackedUp(); render(); toast('Backup shared ✓'); }
      catch (e) { if (e.name !== 'AbortError') toast('Sharing failed: ' + e.message); }
    } else { download(backupName(), backupJSON(), 'application/json'); markBackedUp(); render(); toast('Backup downloaded ✓'); }
  }
  function restoreFromText(text) {
    let next;
    try { next = C.normalizeState(JSON.parse(text)); } catch (e) { toast(e.message || 'That file could not be read.'); return; }
    const when = next.savedAt ? new Date(next.savedAt).toLocaleString() : 'unknown date';
    openSheet('Restore backup?', `<div class="stack">
      <p style="margin:0">This backup from <b>${esc(when)}</b> has <b>${next.kids.length}</b> kids and <b>${next.txns.length}</b> entries.</p>
      <p class="msg warn" style="margin:0">It will replace everything on this device.</p>
      <button class="btn primary block" id="doRestore">Replace with this backup</button></div>`, (root) => {
      $('#doRestore', root.closest('dialog') || document).addEventListener('click', () => {
        S.state = next; S.kidId = next.kids[0] ? next.kids[0].id : null; S.view = 'home';
        persist(); runAuto(); closeSheet(); render(); toast('Backup restored ✓');
      });
    });
  }
  function pickFile() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = () => { const f = inp.files[0]; if (f) f.text().then(restoreFromText); };
    inp.click();
  }

  // Google Drive backup using Google Identity Services and the drive.file scope.
  const Drive = {
    token: null, exp: 0, timer: null,
    clientId() { const el = $('#driveClientId'); const v = el ? el.value.trim() : ''; if (el && v !== (st().settings.driveClientId || '')) { st().settings.driveClientId = v; persist(); } return v || st().settings.driveClientId; },
    loadGis() {
      return new Promise((res, rej) => {
        if (window.google && google.accounts && google.accounts.oauth2) return res();
        const s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.onload = res; s.onerror = () => rej(new Error('Could not reach Google. Are you online?'));
        document.head.appendChild(s);
      });
    },
    async getToken() {
      if (this.token && Date.now() < this.exp - 60000) return this.token;
      const cid = this.clientId();
      if (!cid) throw new Error('Add a Google client ID in Settings first.');
      await this.loadGis();
      return new Promise((res, rej) => {
        const client = google.accounts.oauth2.initTokenClient({
          client_id: cid, scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (r) => { if (r.error) return rej(new Error(r.error)); this.token = r.access_token; this.exp = Date.now() + r.expires_in * 1000; res(this.token); },
          error_callback: (e) => rej(new Error(e.message || e.type || 'Sign-in was cancelled')),
        });
        client.requestAccessToken();
      });
    },
    async api(url, opts) {
      const tok = await this.getToken();
      opts = opts || {};
      opts.headers = Object.assign({ Authorization: 'Bearer ' + tok }, opts.headers || {});
      const r = await fetch(url, opts);
      if (!r.ok && r.status !== 404) throw new Error('Google Drive said ' + r.status);
      return r;
    },
    async findFile() {
      if (meta.driveFileId) return meta.driveFileId;
      const q = encodeURIComponent("name='money-jars-backup.json' and trashed=false");
      const r = await this.api('https://www.googleapis.com/drive/v3/files?q=' + q + '&orderBy=modifiedTime desc&fields=files(id,modifiedTime)');
      const j = await r.json();
      return j.files && j.files[0] ? j.files[0].id : null;
    },
    async save(quiet) {
      const body = backupJSON();
      let id = await this.findFile();
      if (id) {
        const r = await this.api('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
        if (r.status === 404) { meta.driveFileId = null; id = null; }
      }
      if (!id) {
        const boundary = 'mj' + Date.now();
        const multipart = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
          JSON.stringify({ name: 'money-jars-backup.json', mimeType: 'application/json' }) + '\r\n--' + boundary +
          '\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--' + boundary + '--';
        const r = await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: multipart });
        id = (await r.json()).id;
      }
      meta.driveFileId = id; markBackedUp();
      if (!quiet) { render(); toast('Backed up to Google Drive ✓'); }
    },
    async restore() {
      const id = await this.findFile();
      if (!id) throw new Error('No Money Jars backup found in your Drive yet.');
      const r = await this.api('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media');
      if (r.status === 404) { meta.driveFileId = null; saveMeta(); throw new Error('The Drive backup file is gone.'); }
      meta.driveFileId = id; saveMeta();
      restoreFromText(await r.text());
    },
    maybeAuto() {
      if (!st().settings.driveAuto || !this.token || Date.now() > this.exp - 60000) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.save(true).catch((e) => toast('Drive backup failed: ' + e.message)), 2500);
    },
  };

  async function backupNow() {
    if (st().settings.driveClientId) {
      try { await Drive.save(); } catch (e) { toast(e.message); }
    } else shareBackup();
  }

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    const id = el.dataset.id;
    const parentOnly = (fn) => requireParent(fn);
    switch (a) {
      case 'view': S.view = el.dataset.view; render(); window.scrollTo(0, 0); break;
      case 'pick-kid': S.kidId = id; render(); break;
      case 'close-sheet': closeSheet(); break;
      case 'lock': if (parentOK()) { S.unlockedUntil = 0; render(); toast('Locked 🔒'); } else requireParent(() => {}); break;
      case 'unlock': requireParent(() => render()); break;
      case 'money-in': parentOnly(moneyInSheet); break;
      case 'money-out': moneyOutSheet(); break;
      case 'move': moveSheet(); break;
      case 'more': moreSheet(); break;
      case 'growth': parentOnly(growthSheet); break;
      case 'adjust': parentOnly(adjustSheet); break;
      case 'kid-edit': closeSheet(); parentOnly(() => kidSheet(id)); break;
      case 'kid-delete':
        if (confirm('Remove this kid and every entry for them? This cannot be undone.')) {
          st().kids = st().kids.filter((k) => k.id !== id);
          st().txns = st().txns.filter((t) => t.kidId !== id);
          S.kidId = st().kids[0] ? st().kids[0].id : null;
          persist(); closeSheet(); render(); toast('Removed');
        }
        break;
      case 'txn': txnSheet(id); break;
      case 'txn-delete':
        parentOnly(() => {
          if (!confirm('Delete this entry? Balances will be recalculated.')) return;
          const gone = st().txns.find((t) => t.id === id);
          st().txns = st().txns.filter((t) => t.id !== id);
          if (gone) refreshAuto(gone.date);
          persist(); closeSheet(); render(); toast('Entry deleted');
        });
        break;
      case 'export-csv': download('money-jars-' + C.todayStr() + '.csv', C.toCSV(st()), 'text/csv'); break;
      case 'backup-now': backupNow(); break;
      case 'backup-download': download(backupName(), backupJSON(), 'application/json'); markBackedUp(); render(); toast('Backup downloaded ✓'); break;
      case 'backup-share': shareBackup(); break;
      case 'restore-file': parentOnly(pickFile); break;
      case 'drive-save': Drive.save().catch((err) => toast(err.message)); break;
      case 'drive-restore': Drive.restore().catch((err) => toast(err.message)); break;
      case 'recalc':
        if (confirm('Remove all automatic interest and birthday bonus entries and work them out again with the current rules?')) {
          C.clearAutoEntries(st()); persist(); runAuto(); render(); toast('Recalculated ✓');
        }
        break;
      case 'theme': {
        const root = document.documentElement;
        const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = dark ? 'light' : 'dark';
        try { localStorage.setItem('moneyJars.theme', root.dataset.theme); } catch (err) { /* ignore */ }
        break;
      }
      case 'erase':
        if (prompt('Type ERASE to delete all Money Jars data on this device.') === 'ERASE') {
          S.state = C.defaultState(); S.kidId = null; persist(); render(); toast('Erased');
        }
        break;
    }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.item[data-action]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('change', (e) => {
    if (e.target.matches('[data-action="hist-kid"]')) { S.histKid = e.target.value; render(); }
    if (e.target.id === 'driveAuto') { st().settings.driveAuto = e.target.checked; persist(); }
    if (e.target.id === 'driveClientId') { st().settings.driveClientId = e.target.value.trim(); persist(); }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id === 'settingsForm') { e.preventDefault(); saveSettings(e.target); }
  });

  // ---------- start ----------
  try { const th = localStorage.getItem('moneyJars.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* ignore */ }
  loadAll();
  render();
  runAuto();
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
